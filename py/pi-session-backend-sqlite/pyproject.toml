[project]
name = "pi-session-backend-sqlite"
version = "0.85.1"
description = "Native Python SQLite session backend for pi-agent-core"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pi-agent-core==0.85.1", "pi-ai==0.85.1", "pi-chord==0.85.1"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_session_backend_sqlite"]

[tool.uv.sources]
pi-agent-core = { workspace = true }
pi-ai = { workspace = true }
pi-chord = { workspace = true }
