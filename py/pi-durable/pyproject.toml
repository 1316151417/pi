[project]
name = "pi-durable"
version = "0.85.1"
description = "Python port of Pi durable record contracts and detached memory storage"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "pi contributors" }]
dependencies = ["pi-chord==0.85.1"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_durable"]

[tool.uv.sources]
pi-chord = { workspace = true }
