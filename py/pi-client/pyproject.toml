[project]
name = "pi-client"
version = "0.85.1"
description = "Transport-neutral client for remote pi sessions over framed CBOR bytes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pi-chord==0.85.1", "pi-protocol==0.85.1"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_client"]

[tool.uv.sources]
pi-chord = { workspace = true }
pi-protocol = { workspace = true }
