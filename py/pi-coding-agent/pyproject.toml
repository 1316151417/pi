[project]
name = "pi-coding-agent"
version = "0.85.1"
description = "Python port of pi's coding agent orchestration"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pi-agent-core==0.85.1", "pi-ai==0.85.1", "pi-tui==0.85.1", "pillow==11.3.0"]

[project.scripts]
pi-python = "pi_coding_agent.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_coding_agent"]

[tool.uv.sources]
pi-agent-core = { workspace = true }
pi-ai = { workspace = true }
pi-tui = { workspace = true }
