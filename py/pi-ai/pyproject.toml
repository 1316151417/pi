[project]
name = "pi-ai"
version = "0.85.1"
description = "Python port of @earendil-works/pi-ai (dependency surface): LLM provider abstraction, message types, and streaming"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "pi contributors" }]
keywords = ["ai", "llm", "streaming", "providers"]
dependencies = ["httpx==0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_ai"]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
