[project]
name = "pi-server"
version = "0.85.1"
description = "Python port of pi's remote session server"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pi-chord==0.85.1", "pi-agent-core==0.85.1", "pi-protocol==0.85.1"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_server"]

[tool.uv.sources]
pi-chord = { workspace = true }
pi-agent-core = { workspace = true }
pi-protocol = { workspace = true }
