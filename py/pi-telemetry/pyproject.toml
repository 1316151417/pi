[project]
name = "pi-telemetry"
version = "0.85.1"
description = "Python port of pi's vendor-neutral telemetry contracts and schema utilities"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "pi contributors" }]
dependencies = []

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_telemetry"]
