[project]
name = "pi-tui"
version = "0.85.1"
description = "Python port of pi's terminal input, rendering, layout, and editor library"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "pi contributors" }]
dependencies = ["PyICU==2.16.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_tui"]
