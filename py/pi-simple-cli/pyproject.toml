[project]
name = "pi-simple-cli"
version = "0.85.1"
description = "Simple CLI for the pi-agent-core Python port: demo chat, offline self-test, and the durable harness runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "pi contributors" }]
keywords = ["ai", "agent", "llm", "cli"]
dependencies = [
    "pi-agent-core==0.85.1",
    "pi-ai==0.85.1",
]

[project.scripts]
pi = "pi_simple_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_simple_cli"]

[tool.uv.sources]
pi-agent-core = { workspace = true }
pi-ai = { workspace = true }

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
]

[tool.uv]
# `dev` is already uv's default group; stating it keeps the intent explicit.
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
